<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provider Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">🛠 Local Service Finder</a>
    </div>
</nav>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center text-primary">
            👨 Service Provider Details
        </h2>

        <hr>

        <p><strong>Service :</strong> {{ name }}</p>

        <p><strong>Provider :</strong> {{ service.provider }}</p>

        <p><strong>Experience :</strong> {{ service.experience }}</p>

        <p><strong>Contact :</strong> {{ service.contact }}</p>

        <p><strong>Location :</strong> {{ service.location }}</p>

        <p><strong>Available Time :</strong> {{ service.time }}</p>

        <p><strong>Rating :</strong> {{ service.rating }}</p>

        <div class="text-center mt-4">

            <a href="/service/{{ name }}" class="btn btn-primary">
                ⬅ Back
            </a>

        </div>

    </div>

</div>

</body>
</html>
