<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">
            🔐 Local Service Finder - Admin
        </span>

        <a href="/" class="btn btn-outline-light">
            Home
        </a>
        <a href="/admin/logout" class="btn btn-danger ms-2">
    Logout
</a>
    </div>
</nav>

<div class="container mt-5">

    <h2 class="mb-4">
        👋 Welcome Admin
    </h2>

    <div class="row">

        <!-- Users -->
        <div class="col-md-4 mb-4">
            <div class="card shadow text-center p-4">
                <h3>👥</h3>
                <h5>Users</h5>
                <p>Manage registered users</p>
                <a href="/admin/users" class="btn btn-primary">
    View Users
</a>
            </div>
        </div>

        <!-- Bookings -->
        <div class="col-md-4 mb-4">
            <div class="card shadow text-center p-4">
                <h3>📅</h3>
                <h5>Bookings</h5>
                <p>View service bookings</p>
                <a href="/admin/bookings" class="btn btn-success">
    View Bookings
</a>
            </div>
        </div>

        <!-- Reviews -->
        <div class="col-md-4 mb-4">
            <div class="card shadow text-center p-4">
                <h3>⭐</h3>
                <h5>Reviews</h5>
                <p>Manage customer reviews</p>
                <a href="/admin/reviews" class="btn btn-warning">
    View Reviews
</a>
            </div>
        </div>

        <!-- Contact -->
        <div class="col-md-4 mb-4">
            <div class="card shadow text-center p-4">
                <h3>📩</h3>
                <h5>Messages</h5>
                <p>View contact messages</p>
                <a href="/admin/messages" class="btn btn-info">
    View Messages
</a>
            </div>
        </div>

    </div>

</div>

</body>
</html>
